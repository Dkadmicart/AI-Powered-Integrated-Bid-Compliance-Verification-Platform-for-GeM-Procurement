version: '3.8'

services:
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: gem_smartbid_db
    environment:
      POSTGRES_DB: gem_smartbid
      POSTGRES_USER: gem_user
      POSTGRES_PASSWORD: gem_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gem_smartbid_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gem_smartbid_backend
    environment:
      DATABASE_URL: postgresql://gem_user:gem_password@postgres:5432/gem_smartbid
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gem_smartbid_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
